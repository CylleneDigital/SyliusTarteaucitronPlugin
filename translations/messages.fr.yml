        advanced_intro: 'Réglages techniques : les valeurs par défaut conviennent à la plupart des boutiques. Une mauvaise valeur peut empêcher le bandeau de s’afficher.'
        channel: 'Channel'
        compliance_summary: '{1} 1 réglage s’écarte des recommandations CNIL|]1,Inf[ %count% réglages s’écartent des recommandations CNIL'
        tab_has_compliance_findings: 'Réglages qui s’écartent des recommandations CNIL'
        compliance_high_privacy: 'Haute confidentialité désactivée : poursuivre la navigation vaut acceptation. La CNIL exige un consentement explicite, par un acte positif.'
        compliance_deny_all_cta: '« Tout refuser » est masqué alors que « Tout accepter » est affiché : la CNIL demande que refuser soit aussi simple qu’accepter.'
        compliance_service_default_state: 'Services « Acceptés » par défaut : ils se chargent avant tout choix du visiteur, sans consentement.'
        compliance_consent_lifetime: 'Le choix est conservé plus de 6 mois : la CNIL recommande de redemander le consentement au bout de 6 mois (180 jours).'
        tab_texts: 'Textes et langues'
        localized_intro: 'Liens et textes du bandeau, langue par langue (locales du channel). Un champ vide garde le lien de l’onglet Essentiel ou le texte de tarteaucitron, affiché en grisé. Les caractères < > " sont refusés : la bibliothèque insère ces textes dans le HTML.'
        localized_no_locale: 'Ce channel n’a aucune langue : ajoutez-en dans Configuration → Canaux.'
        localized_link_help: 'Vide : lien de l’onglet Essentiel.'
        localized_privacy_url: 'URL de la politique de confidentialité'
        localized_readmore_link: 'URL « En savoir plus »'
        localized_middle_bar_head: 'Titre du bandeau'
        localized_alert_big_privacy: 'Message du bandeau'
        localized_accept_all: 'Bouton « Tout accepter »'
        localized_deny_all: 'Bouton « Tout refuser »'
        localized_personalize: 'Bouton « Personnaliser »'
        localized_close: 'Bouton « Fermer »'
        localized_disclaimer: 'Introduction du panneau de préférences'
        localized_mandatory_text: 'Texte des cookies obligatoires'
        services_search: 'Rechercher un service'
        services_no_match: 'Aucun service ne correspond.'
        services_enabled_count: 'Services activés / services disponibles'
