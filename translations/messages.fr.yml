        enabled: 'Activer Tarteaucitron'
        consent_lifetime_days: 'Durée de conservation du choix (jours)'
        consent_lifetime_days_help: 'Durée pendant laquelle le choix du visiteur est mémorisé avant de lui redemander son consentement. La CNIL recommande 6 mois (180 jours). Maximum 364 : tarteaucitron ignore les valeurs supérieures et garde alors 1 an.'
        privacy_url: 'URL de la politique de confidentialité'
        privacy_url_help: 'Page de votre politique de confidentialité, liée depuis le bandeau. Sur cette page, un bandeau « milieu » passe en bas pour ne pas masquer le contenu.'
        body_position: 'Position DOM du bandeau (accessibilité)'
        body_position_help: 'Où le bandeau est inséré dans le code de la page. « Début du body » : lu en premier par les lecteurs d’écran (recommandé pour l’accessibilité).'
        body_position_top: 'Début du body'
        body_position_bottom: 'Fin du body'
        orientation: 'Position du bandeau'
        orientation_help: 'Emplacement du bandeau. « Milieu » et « Popup » bloquent la page jusqu’au choix du visiteur ; « Haut » et « Bas » la laissent utilisable.'
        orientation_top: 'Haut'
        orientation_middle: 'Milieu'
        orientation_bottom: 'Bas'
        orientation_popup: 'Popup'

        high_privacy: 'Mode haute confidentialité'
        high_privacy_help: 'Recommandé. Activé : aucun service n’est chargé tant que le visiteur n’a pas choisi. Désactivé : poursuivre la navigation vaut acceptation (consentement implicite, non conforme aux recommandations CNIL).'
        always_need_consent: 'Toujours demander le consentement (services privacy by design)'
        always_need_consent_help: 'Demande aussi le consentement pour les services déclarés « privacy by design » par tarteaucitron (qui se chargent sinon sans demander).'
        accept_all_cta: 'Afficher le bouton "Tout accepter"'
        accept_all_cta_help: 'N’a d’effet qu’avec le mode haute confidentialité activé : désactivé, le bandeau n’affiche alors que « Personnaliser » (sans Tout accepter / Tout refuser). Sans haute confidentialité, « Tout accepter » reste toujours affiché.'
        deny_all_cta: 'Afficher le bouton "Tout refuser"'
        deny_all_cta_help: 'Contrôle le bouton « Tout refuser » sur le bandeau uniquement quand celui-ci affiche aussi « Tout accepter ». Si haute confidentialité est activé et « Tout accepter » désactivé, ce réglage n’a aucun effet. Le panneau de préférences garde toujours ses boutons tout autoriser / tout refuser.'
        mandatory: 'Afficher le message cookies obligatoires'
        mandatory_help: 'Affiche dans le panneau une ligne « Cookies obligatoires » expliquant que les cookies nécessaires au site ne peuvent pas être désactivés.'
        show_icon: 'Afficher l’icône flottante'
        show_icon_help: 'Affiche l’icône flottante qui permet au visiteur de rouvrir le panneau et de modifier son choix à tout moment. Si ni l’icône ni le bandeau compact ne sont affichés, prévoyez un lien vers le panneau dans votre thème.'
        icon_position: 'Position de l’icône'
        icon_position_help: 'Coin de l’écran où s’affiche l’icône flottante.'
        icon_src: 'URL ou base64 de l’icône personnalisée'
        icon_src_help: 'Remplace l’icône flottante par défaut : URL http(s) ou image base64 (PNG, JPEG, GIF, WebP). Vide : icône tarteaucitron.'
        icon_bottom_right: 'En bas à droite'
        icon_bottom_left: 'En bas à gauche'
        icon_top_right: 'En haut à droite'
        icon_top_left: 'En haut à gauche'

        consent_mode_intro: 'Ces options envoient les signaux de consentement aux plateformes. Ce ne sont pas des services à part : activez aussi les services concernés à droite, et retirez les mêmes tags du thème ou de GTM pour éviter un double chargement.'
        consent_mode_related_services: 'Services liés'
        service_status_on: 'activé'
        service_status_off: 'désactivé'

        google_consent_mode: 'Activer Google Consent Mode'
        google_consent_mode_help: 'Met à jour automatiquement les signaux Google (analytics_storage, ad_storage, etc.) quand GA4 et/ou Google Ads sont acceptés dans le bandeau.'
        google_consent_mode_gtm_warning: 'GTM est activé sans GA4 ni Google Ads côté Tarteaucitron. Consent Mode ne suivra pas automatiquement les tags Google chargés uniquement via GTM. Préférez activer GA4 / Google Ads ici (et retirer ces tags de GTM).'
        google_consent_mode_no_service_hint: 'Aucun service Google natif n’est activé. Activez GA4 et/ou Google Ads à droite pour que Consent Mode ait un effet.'

        piano_consent_mode: 'Activer Piano Consent Mode'
        piano_consent_mode_help: 'Drapeau officiel tarteaucitron.init() pour Piano Analytics. Ajoutez le service Piano (tracker personnalisé) si vous l’utilisez.'
        piano_consent_mode_essential: 'Piano Consent Mode essentiel'
        piano_consent_mode_essential_help: 'Charge Piano en mode essentiel plutôt qu’en opt-out par défaut (pianoConsentModeEssential officiel).'
        piwik_consent_mode: 'Activer Piwik PRO Consent Mode'
        piwik_consent_mode_help: 'Drapeau officiel tarteaucitron.init() pour Piwik PRO : transmet le consentement analytics au consent manager de Piwik PRO. Ajoutez le service Piwik PRO (tracker personnalisé) si vous l’utilisez.'

        bing_consent_mode: 'Activer Bing Consent Mode'
        bing_consent_mode_help: 'Met à jour les signaux Microsoft quand Clarity et/ou Bing Ads sont acceptés dans le bandeau.'
        bing_consent_mode_no_service_hint: 'Aucun service Microsoft lié n’est activé. Activez Clarity et/ou Bing Ads à droite pour que Consent Mode ait un effet.'

        soft_consent_mode: 'Mode soft consent'
        soft_consent_mode_help: 'Désactivé (recommandé avec Consent Mode) : les tags liés peuvent se charger en mode restreint avant acceptation, puis passer en granted. Activé : les tags ne se chargent qu’après consentement (comportement cookie classique).'

        service_badge_google_consent: 'Google Consent Mode'
        service_badge_bing_consent: 'Bing Consent Mode'
        service_badge_gtm: 'Attention GTM'
        service_hint_google_native: 'À utiliser ici plutôt que via GTM. Retirez le même tag du site / de GTM.'
        service_hint_bing_native: 'À utiliser ici plutôt que via un autre script. Retirez le même tag du site / de GTM.'
        service_hint_gtm: 'GTM seul ne met pas à jour Consent Mode pour GA4 / Ads. Configurez ces services ici, ou gérez les signaux GCM manuellement.'
        group_services: 'Grouper les services par catégorie'
        group_services_help: 'Regroupe les services par catégorie dans le panneau (Mesure d’audience, Publicité…), avec un choix global par catégorie.'
        show_details_on_click: 'Déplier la description au clic'
        show_details_on_click_help: 'Replie la description de chaque catégorie de services (Mesure d’audience, Publicité…) ; le visiteur la déplie au clic sur le nom de la catégorie. Toujours actif quand les services sont groupés.'
        service_default_state: 'État par défaut des services'
        service_default_state_help: 'État d’un service tant que le visiteur n’a rien choisi. « En attente » (recommandé) : le bandeau reste affiché. « Accepté » charge les services sans consentement.'
        service_default_state_true: 'Accepté'
        service_default_state_wait: 'En attente'
        service_default_state_false: 'Refusé'
        cookie_name: 'Nom du cookie'
        cookie_name_help: 'Nom du cookie qui mémorise les choix du visiteur. Le changer fait réapparaître le bandeau pour tous les visiteurs.'
        show_alert_small: 'Utiliser le bandeau compact'
        show_alert_small_help: 'Une fois le choix du visiteur fait, affiche en bas de page un petit bouton « Gestion des services » qui rouvre le panneau, avec le nombre de cookies si la liste des cookies du bandeau compact est activée. Rien n’apparaît tant que le bandeau est ouvert.'
        show_title_banner: 'Afficher le titre sur les bandeaux haut/bas'
        show_title_banner_help: 'Affiche le titre du bandeau (texte « middleBarHead ») quand le bandeau est en haut ou en bas.'
        cookies_list: 'Afficher la liste des cookies (mini bandeau)'
        cookies_list_help: 'Ajoute au bandeau compact un bouton affichant la liste des cookies déposés. Sans effet si le bandeau compact est désactivé.'
        cookieslist_embed: 'Afficher la liste des cookies dans le panneau'
        cookieslist_embed_help: 'Affiche la liste des cookies déposés directement dans le panneau de préférences.'
        close_popup: 'Afficher le bouton de fermeture'
        close_popup_help: 'Ajoute une croix de fermeture au bandeau. La fermer ne vaut pas acceptation : les services restent en attente.'
        handle_browser_dnt_request: 'Respecter la demande DNT du navigateur'
        handle_browser_dnt_request_help: 'Si le navigateur envoie « Do Not Track », les services sont refusés automatiquement tant que le visiteur n’a rien choisi.'
        remove_credit: 'Masquer le crédit Tarteaucitron'
        remove_credit_help: 'Masque la mention « Propulsé par tarteaucitron » dans le panneau. La licence MIT de la bibliothèque l’autorise.'
        more_info_link: 'Afficher le lien "En savoir plus"'
        more_info_link_help: 'Affiche sous chaque service les liens « En savoir plus » et « Site officiel ».'
        readmore_link: 'URL "En savoir plus"'
        readmore_link_help: 'Page vers laquelle pointent les liens « En savoir plus » de chaque service dans le panneau. Vide : lien vers la politique de l’éditeur du service.'
        cookie_domain: 'Domaine du cookie (multisite)'
        cookie_domain_help: 'Domaine du cookie de consentement, pour partager le choix entre sous-domaines (ex. .example.com). Vide : domaine courant uniquement.'
        data_layer: 'Envoyer le statut au dataLayer'
        data_layer_help: 'Envoie un évènement « tac_consent_update » dans le dataLayer (GTM) avec la liste des services acceptés.'
        partners_list: 'Afficher le nombre de partenaires sur le bandeau'
        partners_list_help: 'Affiche le nombre de partenaires (services) sur le bandeau. Uniquement pour les bandeaux « Milieu » et « Popup ».'

        service_incomplete: 'Ce service est activé mais un identifiant obligatoire manque. Tarteaucitron ne le chargera pas en boutique tant que le champ n’est pas renseigné.'
        services_incomplete_summary: 'Activés mais non chargés en boutique, faute d’identifiant obligatoire : %services%.'
        conflict_group_services_adblocker: 'Sans effet tant que la détection des bloqueurs de publicité est activée (integration.adblocker dans la configuration du bundle) : tarteaucitron.js construit alors son panneau après avoir tenté le regroupement, et les services restent listés sans groupe.'
        conflict_show_alert_small_icon: 'Avec l’icône flottante aussi affichée, le bouton « Gestion des services » n’ouvre pas le panneau : tarteaucitron.js donne le même identifiant aux deux boutons et ne branche que l’icône. Gardez l’un ou l’autre.'

