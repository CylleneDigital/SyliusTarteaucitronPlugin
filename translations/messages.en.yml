        tab_advanced: 'Advanced'
        section_compliance: 'Consent collection'
        section_consent_mode: 'Consent Mode (platform signals)'
        advanced_intro: 'Technical settings: the defaults suit most shops. A wrong value can stop the banner from showing.'
        channel: 'Channel'
        compliance_summary: '{1} 1 setting departs from the CNIL guidance|]1,Inf[ %count% settings depart from the CNIL guidance'
        tab_has_compliance_findings: 'Settings that depart from the CNIL guidance'
        compliance_high_privacy: 'High privacy is off: browsing on counts as acceptance. The CNIL requires explicit consent, through a positive action.'
        compliance_deny_all_cta: '"Deny all" is hidden while "Accept all" is shown: the CNIL asks that refusing be as easy as accepting.'
        compliance_service_default_state: 'Services "Accepted" by default: they load before the visitor chooses, without consent.'
        compliance_consent_lifetime: 'The choice is kept more than 6 months: the CNIL recommends asking again after 6 months (180 days).'
        tab_texts: 'Texts and languages'
        localized_intro: 'Banner links and texts, language by language (channel locales). An empty field keeps the Essentials tab link or the tarteaucitron text, shown greyed out. The characters < > " are refused: the library inserts these texts into the HTML.'
        localized_no_locale: 'This channel has no locale: add some in Configuration → Channels.'
        localized_link_help: 'Empty: link from the Essentials tab.'
        localized_privacy_url: 'Privacy policy URL'
        localized_readmore_link: '"Read more" URL'
        localized_middle_bar_head: 'Banner title'
        localized_alert_big_privacy: 'Banner message'
        localized_accept_all: '"Accept all" button'
        localized_deny_all: '"Deny all" button'
        localized_personalize: '"Personalize" button'
        localized_close: '"Close" button'
        localized_disclaimer: 'Preferences panel introduction'
        localized_mandatory_text: 'Mandatory cookies text'
        services_search: 'Search a service'
        services_no_match: 'No service matches.'
        services_enabled_count: 'Enabled services / available services'
        services: 'Services'

        enabled: 'Enable Tarteaucitron'
        consent_lifetime_days: 'Consent lifetime (days)'
        consent_lifetime_days_help: 'How long the visitor''s choice is kept before asking again. The CNIL recommends 6 months (180 days). At most 364: tarteaucitron ignores higher values and then keeps 1 year.'
        privacy_url: 'Privacy policy URL'
        privacy_url_help: 'Your privacy policy page, linked from the banner. On that page, a "middle" banner moves to the bottom so it does not hide the content.'
        body_position: 'Banner DOM position (accessibility)'
        body_position_help: 'Where the banner is inserted in the page markup. "Start of body": read first by screen readers (recommended for accessibility).'
        body_position_top: 'Top of body'
        body_position_bottom: 'Bottom of body'
        orientation: 'Banner position'
        orientation_help: 'Banner placement. "Middle" and "Popup" block the page until the visitor chooses; "Top" and "Bottom" keep it usable.'
        orientation_top: 'Top'
        orientation_middle: 'Middle'
        orientation_bottom: 'Bottom'
        orientation_popup: 'Popup'

        high_privacy: 'High privacy mode'
        high_privacy_help: 'Recommended. On: no service loads until the visitor chooses. Off: browsing on counts as acceptance (implied consent, not compliant with CNIL recommendations).'
        always_need_consent: 'Always need consent (privacy by design services)'
        always_need_consent_help: 'Also asks consent for services tarteaucitron flags as "privacy by design" (which otherwise load without asking).'
        accept_all_cta: 'Show "Accept all" button'
        accept_all_cta_help: 'Only takes effect when high privacy mode is on: if off, the banner then shows only “Personalize” (no Accept all / Deny all). Without high privacy, “Accept all” is always shown.'
        deny_all_cta: 'Show "Deny all" button'
        deny_all_cta_help: 'Controls the “Deny all” button on the banner only when that banner also shows “Accept all”. If high privacy is on and “Accept all” is off, this setting has no effect. The preferences panel always keeps its allow-all / deny-all buttons.'
        mandatory: 'Show mandatory cookies message'
        mandatory_help: 'Shows a "Mandatory cookies" line in the panel explaining that cookies the site needs cannot be disabled.'
        show_icon: 'Show floating icon'
        show_icon_help: 'Shows the floating icon that lets the visitor reopen the panel and change their choice at any time. With neither the icon nor the compact banner, add a link to the panel in your theme.'
        icon_position: 'Icon position'
        icon_position_help: 'Screen corner of the floating icon.'
        icon_src: 'Custom icon URL or base64'
        icon_src_help: 'Replaces the default floating icon: http(s) URL or base64 image (PNG, JPEG, GIF, WebP). Empty: tarteaucitron icon.'
        icon_bottom_right: 'Bottom right'
        icon_bottom_left: 'Bottom left'
        icon_top_right: 'Top right'
        icon_top_left: 'Top left'

        consent_mode_intro: 'These options send consent signals to platforms. They are not standalone services: also enable the related services on the right, and remove the same tags from your theme or GTM to avoid double-loading.'
        consent_mode_related_services: 'Related services'
        service_status_on: 'on'
        service_status_off: 'off'

        google_consent_mode: 'Enable Google Consent Mode'
        google_consent_mode_help: 'Automatically updates Google signals (analytics_storage, ad_storage, etc.) when GA4 and/or Google Ads are accepted in the banner.'
        google_consent_mode_gtm_warning: 'GTM is enabled without GA4 or Google Ads in Tarteaucitron. Consent Mode will not automatically follow Google tags loaded only via GTM. Prefer enabling GA4 / Google Ads here (and remove those tags from GTM).'
        google_consent_mode_no_service_hint: 'No native Google service is enabled. Enable GA4 and/or Google Ads on the right for Consent Mode to take effect.'

        piano_consent_mode: 'Enable Piano Consent Mode'
        piano_consent_mode_help: 'Official tarteaucitron.init() flag for Piano Analytics. Enable the Piano service (custom tracker) if you use it.'
        piano_consent_mode_essential: 'Piano Consent Mode essential'
        piano_consent_mode_essential_help: 'Load Piano in essential mode instead of opt-out by default (official pianoConsentModeEssential).'
        piwik_consent_mode: 'Enable Piwik PRO Consent Mode'
        piwik_consent_mode_help: 'Official tarteaucitron.init() flag for Piwik PRO: forwards the analytics consent to the Piwik PRO consent manager. Enable the Piwik PRO service (custom tracker) if you use it.'

        bing_consent_mode: 'Enable Bing Consent Mode'
        bing_consent_mode_help: 'Updates Microsoft signals when Clarity and/or Bing Ads are accepted in the banner.'
        bing_consent_mode_no_service_hint: 'No related Microsoft service is enabled. Enable Clarity and/or Bing Ads on the right for Consent Mode to take effect.'

        soft_consent_mode: 'Soft consent mode'
        soft_consent_mode_help: 'Off (recommended with Consent Mode): related tags can load in a restricted mode before acceptance, then switch to granted. On: tags load only after consent (classic cookie behaviour).'

        service_badge_google_consent: 'Google Consent Mode'
        service_badge_bing_consent: 'Bing Consent Mode'
        service_badge_gtm: 'GTM warning'
        service_hint_google_native: 'Configure it here rather than via GTM. Remove the same tag from the site / GTM.'
        service_hint_bing_native: 'Configure it here rather than via another script. Remove the same tag from the site / GTM.'
        service_hint_gtm: 'GTM alone does not update Consent Mode for GA4 / Ads. Configure those services here, or manage GCM signals manually.'
        group_services: 'Group services by category'
        group_services_help: 'Groups services by category in the panel (Analytics, Ads…), with one choice per category.'
        show_details_on_click: 'Expand description on click'
        show_details_on_click_help: 'Collapses the description of each service category (Analytics, Ads…); the visitor expands it by clicking the category name. Always on when services are grouped.'
        service_default_state: 'Default service state'
        service_default_state_help: 'State of a service until the visitor chooses. "Waiting" (recommended) keeps the banner displayed. "Accepted" loads services without consent.'
        service_default_state_true: 'Accepted'
        service_default_state_wait: 'Wait'
        service_default_state_false: 'Denied'
        cookie_name: 'Cookie name'
        cookie_name_help: 'Name of the cookie storing the visitor''s choices. Changing it shows the banner again to every visitor.'
        show_alert_small: 'Use compact banner'
        show_alert_small_help: 'Once the visitor has chosen, shows a small "Manage services" button at the bottom of the page that reopens the panel, with the cookie count when the compact banner cookie list is on. Nothing shows while the banner is open.'
        show_title_banner: 'Show title on top/bottom banners'
        show_title_banner_help: 'Shows the banner title ("middleBarHead" text) when the banner is at the top or bottom.'
        cookies_list: 'Show cookies list in mini banner'
        cookies_list_help: 'Adds a button listing the cookies set on the site to the compact banner. No effect without the compact banner.'
        cookieslist_embed: 'Show cookies list on control panel'
        cookieslist_embed_help: 'Shows the list of cookies set on the site inside the preferences panel.'
        close_popup: 'Show close button on banner'
        close_popup_help: 'Adds a close cross to the banner. Closing it is not acceptance: services stay waiting.'
        handle_browser_dnt_request: 'Honor browser DNT request'
        handle_browser_dnt_request_help: 'When the browser sends "Do Not Track", services are denied automatically until the visitor chooses.'
        remove_credit: 'Hide Tarteaucitron credit'
        remove_credit_help: 'Hides the "Powered by tarteaucitron" credit in the panel. The library MIT licence allows it.'
        more_info_link: 'Show "More info" link'
        more_info_link_help: 'Shows "Read more" and "Official website" links under each service.'
        readmore_link: 'Read more URL'
        readmore_link_help: 'Target of each service''s "Read more" link in the panel. Empty: the service vendor''s policy.'
        cookie_domain: 'Cookie domain (multisite)'
        cookie_domain_help: 'Consent cookie domain, to share the choice across subdomains (e.g. .example.com). Empty: current domain only.'
        data_layer: 'Send status events to dataLayer'
        data_layer_help: 'Pushes a "tac_consent_update" event to the dataLayer (GTM) with the list of accepted services.'
        partners_list: 'Show partners count on banner'
        partners_list_help: 'Shows the number of partners (services) on the banner. "Middle" and "Popup" banners only.'

        service_incomplete: 'This service is enabled but a required identifier is missing. Tarteaucitron will not load it on the shop until the field is filled.'
        services_incomplete_summary: 'Enabled but not loaded on the shop, a required identifier is missing: %services%.'
        conflict_group_services_adblocker: 'No effect while the ad-blocker detection is on (integration.adblocker in the bundle configuration): tarteaucitron.js then builds its panel after trying to group, and services stay listed without groups.'
        conflict_show_alert_small_icon: 'With the floating icon also shown, the "Manage services" button does not open the panel: tarteaucitron.js gives both buttons the same id and only wires the icon. Keep one or the other.'

