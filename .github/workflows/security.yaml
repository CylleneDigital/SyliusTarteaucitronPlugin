name: Security

on:
    push:
        branches:
            - main
    pull_request: ~
    schedule:
        -
            cron: "0 7 * * 1"
    workflow_dispatch: ~

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        name: "Composer audit"

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: "8.4"
                    coverage: none

            -
                name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist

            # `--abandoned=report` surfaces abandoned packages without failing the job: Sylius
            # development dependencies may be abandoned without a security flaw.
            -
                name: Audit dependencies
                run: composer audit --ansi --abandoned=report

            # The resolution above takes the newest packages (Sylius 2.3, Symfony 8). PHP 8.2 resolves
            # the Sylius 2.1 / 2.2 and Symfony 7.4 lines instead, which shops also install.
            -
                name: Audit the PHP 8.2 resolution
                run: |
                    composer config platform.php 8.2.0
                    composer update --no-interaction --no-progress --prefer-dist
                    composer audit --ansi --abandoned=report
