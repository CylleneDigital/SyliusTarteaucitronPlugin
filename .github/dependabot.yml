version: 2
updates:
    - package-ecosystem: composer
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "10:00"
      open-pull-requests-limit: 10
      groups:
          composer:
              patterns: ["*"]
              update-types: [minor, patch]
      ignore:
          # PHPUnit 12 and page-object-extension 0.4 drop PHP 8.2, still supported by the plugin.
          - dependency-name: phpunit/phpunit
            versions: [">=12"]
          - dependency-name: friends-of-behat/page-object-extension
            versions: [">=0.4"]
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "10:00"
      open-pull-requests-limit: 5
